name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag"
        required: false
        default: "dev"
        type: string
      platform:
        description: "Target architecture platform"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - amd64
          - arm64
      runtime:
        description: "Container runtime target"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - docker
          - podman
      compose:
        description: "Include Docker Compose"
        required: false
        default: true
        type: boolean
      buildx:
        description: "Include Docker Buildx"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      version:
        required: false
        default: "dev"
        type: string
      platform:
        required: false
        default: "both"
        type: string
      runtime:
        required: false
        default: "both"
        type: string
      compose:
        required: false
        default: true
        type: boolean
      buildx:
        required: false
        default: true
        type: boolean

env:
  GO_VERSION: "1.25"
  GOTOOLCHAIN: "local"
  RUST_VERSION: "stable"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      arches: ${{ steps.plan.outputs.arches }}

    steps:
      - uses: actions/checkout@v4

      - name: Plan build matrix
        id: plan
        env:
          PLATFORM: ${{ inputs.platform || 'both' }}
          RUNTIME: ${{ inputs.runtime || 'both' }}
          COMPOSE: ${{ inputs.compose }}
          BUILDX: ${{ inputs.buildx }}
        run: .github/scripts/plan-matrix.sh

  build:
    needs: plan
    name: build (${{ matrix.arch }} / ${{ matrix.component }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Load versions
        run: .github/scripts/load-versions.sh

      - name: Setup Go
        if: matrix.go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Rust
        if: matrix.rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-unknown-linux-musl' || 'x86_64-unknown-linux-musl' }}

      - name: Cache Go build
        if: matrix.go
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-${{ matrix.arch }}-${{ matrix.component }}-${{ hashFiles('versions.env') }}
          restore-keys: |
            go-${{ matrix.arch }}-${{ matrix.component }}-

      - name: Cache Cargo registry
        if: matrix.rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ matrix.arch }}-${{ hashFiles('versions.env') }}
          restore-keys: |
            cargo-registry-${{ matrix.arch }}-

      # Exact key only — cargo decides freshness by mtime, and sources are
      # re-extracted with upstream timestamps. Falling back to an older
      # version's target dir could pass a stale binary off as the new one.
      - name: Cache Cargo build
        if: matrix.rust
        uses: actions/cache@v4
        with:
          path: |
            /tmp/netavark/target
            /tmp/aardvark-dns/target
          key: cargo-build-${{ matrix.arch }}-${{ hashFiles('versions.env') }}

      - name: Setup build environment
        run: .github/scripts/setup-env.sh "${{ matrix.arch }}" "${{ matrix.apt }}"

      - name: Build ${{ matrix.component }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
        run: .github/scripts/build-binaries.sh

      - name: Stage binaries
        run: .github/scripts/stage-binaries.sh "${{ matrix.component }}"

      # tar keeps the executable bit, which artifact upload would drop
      - name: Pack part
        run: tar -cf /tmp/part.tar -C /tmp/dockpod-bundle .

      - name: Upload part
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.arch }}-${{ matrix.component }}
          path: /tmp/part.tar
          retention-days: 1

  bundle:
    needs: [plan, build]
    name: bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download parts
        uses: actions/download-artifact@v4
        with:
          pattern: part-${{ matrix.arch }}-*
          path: /tmp/parts

      - name: Unpack parts
        run: |
          mkdir -p /tmp/dockpod-bundle
          for part in /tmp/parts/*/part.tar; do
              echo "  ${part}"
              tar -xf "$part" -C /tmp/dockpod-bundle
          done
          find /tmp/dockpod-bundle -type f | sort

      - name: Test binaries
        if: matrix.arch == 'amd64'
        run: sudo .github/scripts/test-binaries.sh

      - name: Bundle tarball
        run: .github/scripts/bundle-tarball.sh "${{ inputs.version || 'dev' }}" "${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockpod-${{ matrix.arch }}
          path: |
            ${{ env.TARBALL }}
            ${{ env.CHECKSUM }}
